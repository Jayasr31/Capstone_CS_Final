<div class="page-wrapper">
  <div class="page-hero">
    <h1 class="section-title">Add Party Hall</h1>
    <div class="gold-divider" style="margin: 0.75rem auto 0;"></div>
    <p class="section-subtitle" style="margin-top:0.5rem">Add a new venue to the CelebrateSpot platform</p>
  </div>

  <div class="container">
    <div class="form-card animate-fadeInUp">
      <div class="alert alert-error" *ngIf="errorMsg"><i class="fas fa-exclamation-circle"></i> {{ errorMsg }}</div>
      <div class="alert alert-success" *ngIf="successMsg"><i class="fas fa-check-circle"></i> {{ successMsg }}</div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Hall Name *</label>
          <input type="text" class="form-control" [(ngModel)]="hall.hallName" placeholder="e.g., Grand Ballroom">
        </div>

        <div class="form-group">
          <label class="form-label">Location *</label>
          <input type="text" class="form-control" [(ngModel)]="hall.hallLocation" placeholder="e.g., Bandra, Mumbai">
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fas fa-map-marker-alt" style="color:#D4AF37"></i> Full Address <span style="font-size:0.78rem; color:var(--text-muted)">(used for Google Maps pin)</span></label>
          <input type="text" class="form-control" [(ngModel)]="hall.fullAddress" placeholder="e.g., 12 Linking Road, Bandra West, Mumbai 400050">
        </div>

        <div class="form-group">
          <label class="form-label">Price per Day (₹) *</label>
          <input type="number" class="form-control" [(ngModel)]="hall.price" placeholder="50000" min="0">
        </div>

        <div class="form-group">
          <label class="form-label">Capacity (persons) *</label>
          <input type="number" class="form-control" [(ngModel)]="hall.capacity" placeholder="200" min="1">
        </div>

        <div class="form-group">
          <label class="form-label">Availability Status *</label>
          <select class="form-control" [(ngModel)]="hall.hallAvailableStatus">
            <option value="Available">Available</option>
            <option value="Not Available">Not Available</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Theme</label>
          <select class="form-control" [(ngModel)]="hall.theme">
            <option value="">Select Theme</option>
            <option *ngFor="let t of themes" [value]="t">{{ t }}</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label class="form-label">Main Image *</label>
          <div class="file-upload-area" (click)="mainImageInput.click()" *ngIf="!imagePreview">
            <i class="fas fa-cloud-upload-alt upload-icon"></i>
            <p class="upload-text">Click to upload main image</p>
            <p class="upload-hint">PNG, JPG, WEBP — Max 5MB</p>
          </div>
          <input #mainImageInput type="file" accept="image/*" style="display:none" (change)="onMainImageSelected($event)">
          <div class="image-preview-box" *ngIf="imagePreview">
            <img [src]="imagePreview" alt="Main Image Preview" class="preview-img">
            <button type="button" class="btn-remove-img" (click)="removeMainImage()">
              <i class="fas fa-times"></i> Remove
            </button>
          </div>
        </div>

        <div class="form-group full-width">
          <label class="form-label">Additional Images (up to 5)</label>
          <div class="file-upload-area secondary-upload" (click)="additionalImagesInput.click()">
            <i class="fas fa-images upload-icon-sm"></i>
            <p class="upload-text">Click to upload additional images</p>
            <p class="upload-hint">Up to 5 images — PNG, JPG, WEBP</p>
          </div>
          <input #additionalImagesInput type="file" accept="image/*" multiple style="display:none" (change)="onAdditionalImagesSelected($event)">
          <div class="additional-previews" *ngIf="additionalImagePreviews.length > 0">
            <div class="additional-preview-item" *ngFor="let src of additionalImagePreviews; let i = index">
              <img [src]="src" alt="Additional Image {{i+1}}">
              <button type="button" class="btn-remove-small" (click)="removeAdditionalImage(i)"><i class="fas fa-times"></i></button>
            </div>
          </div>
        </div>

        <div class="form-group full-width">
          <label class="form-label">Description</label>
          <textarea class="form-control" [(ngModel)]="hall.description" placeholder="Describe the party hall, facilities, special features..." rows="4"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-outline-gold" (click)="resetForm()">
          <i class="fas fa-redo"></i> Reset
        </button>
        <button class="btn-gold" (click)="onSubmit()" [disabled]="isLoading">
          <span *ngIf="!isLoading"><i class="fas fa-plus-circle"></i> Add Party Hall</span>
          <span *ngIf="isLoading"><span class="spinner-sm"></span> Adding...</span>
        </button>
      </div>
    </div>
  </div>
</div>
